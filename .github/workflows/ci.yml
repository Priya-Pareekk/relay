name: Relay CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    name: Build & Verify (Unit + Testcontainers Integration Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run Build and Tests (Unit & Testcontainers)
        run: ./mvnw -B clean verify
        env:
          # Enable Testcontainers reuse/daemon support in CI runner
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Print Test Failures on Failure
        if: failure()
        run: |
          echo "==================== SUREFIRE TEST REPORTS ===================="
          find target/surefire-reports -type f -name "*.txt" -exec cat {} + || true

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7
